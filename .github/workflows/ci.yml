---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core \
            "molecule~=25.0" "molecule-plugins[docker]~=25.0" \
            ansible-lint yamllint

      - name: Instalar roles y colecciones
        run: ansible-galaxy install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu-2204
          - debian-12
          - rockylinux-9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core \
            "molecule~=25.0" "molecule-plugins[docker]~=25.0"

      - name: Instalar roles y colecciones
        run: ansible-galaxy install -r requirements.yml

      - name: Molecule
        run: molecule test --platform-name ${{ matrix.distro }}
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
