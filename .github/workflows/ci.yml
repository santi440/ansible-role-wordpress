---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar roles y colecciones
        run: ansible-galaxy install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu-2204
          - debian-12
          - rockylinux-9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar roles y colecciones
        run: ansible-galaxy install -r requirements.yml

      - name: Molecule
        run: molecule test --platform-name ${{ matrix.distro }}
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}

  galaxy:
    name: Publicar en Galaxy
    runs-on: ubuntu-latest
    needs:
      - lint
      - molecule
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Importar el role en Galaxy
        uses: robertdebock/galaxy-action@1.2.1
        with:
          git_branch: main
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
