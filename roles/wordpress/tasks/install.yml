---
# ansible.builtin.package es independiente de si es apt o dnf. En apt quiero
# hacer un update, por eso la primera tarea actualiza el caché sólo si la
# familia es Debian (Debian/Ubuntu).
- name: Actualizar caché de apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Instalar paquetes necesarios
  ansible.builtin.package:
    name: "{{ wordpress_packages + wordpress_php_extensions_extra }}"
    state: present

- name: Crear directorio de instalación
  ansible.builtin.file:
    path: "{{ wordpress_install_dir }}"
    state: directory
    owner: "{{ wordpress_web_user }}"
    group: "{{ wordpress_web_user }}"
    mode: "0755"

- name: Descargar y descomprimir WordPress
  ansible.builtin.unarchive:
    src: "https://wordpress.org/{{ 'latest' if wordpress_version == 'latest' else 'wordpress-' + wordpress_version }}.tar.gz"
    dest: "{{ wordpress_install_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    owner: "{{ wordpress_web_user }}"
    group: "{{ wordpress_web_user }}"
    creates: "{{ wordpress_install_dir }}/wp-settings.php"
